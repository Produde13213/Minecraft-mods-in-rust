[package]
name = "geyser-rs"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Clean-room Rust Bedrock-to-Java protocol bridge inspired by Geyser's public protocol behavior."

[dependencies]
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "signal", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dev-dependencies]
